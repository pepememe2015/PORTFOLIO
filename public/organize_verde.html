<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ابزار دسته‌بندی و مرتب‌سازی نمونه کارها - ورده</title>
  <style>
    @font-face {
      font-family: 'PortadaLocal';
      src: url('/fonts/PortadaARA-Regular.otf') format('opentype');
      font-weight: 400;
    }
    @font-face {
      font-family: 'PortadaLocal';
      src: url('/fonts/PortadaARA-Bold.otf') format('opentype');
      font-weight: 700;
    }
    
    :root {
      --background: #DBE7ED;
      --secondary-background: #ffffff;
      --foreground: #1a1a1a;
      --main: #39829B;
      --border: #000000;
      --shadow: 4px 4px 0px 0px var(--border);
    }

    * {
      box-sizing: border-box;
      font-family: 'PortadaLocal', Tahoma, sans-serif;
    }

    body {
      background-color: var(--background);
      background-image: radial-gradient(rgba(0,0,0,0.08) 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      color: var(--foreground);
      margin: 0;
      padding: 40px 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      background: var(--secondary-background);
      border: 3px solid var(--border);
      box-shadow: var(--shadow);
      padding: 20px 30px;
      border-radius: 5px;
      margin-bottom: 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    h1 {
      margin: 0 0 10px 0;
      font-size: 24px;
      font-weight: 700;
    }

    p.subtitle {
      margin: 0;
      color: #666;
      font-size: 14px;
    }

    .btn-save {
      background-color: #4EAA84;
      color: white;
      border: 3px solid var(--border);
      box-shadow: var(--shadow);
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-save:hover {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px 0px var(--border);
    }

    .btn-save:active {
      transform: translate(4px, 4px);
      box-shadow: none;
    }

    .stats {
      display: flex;
      gap: 20px;
      margin-top: 15px;
      font-weight: 700;
      font-size: 14px;
    }

    .stat-badge {
      background: #eee;
      border: 2px solid var(--border);
      padding: 4px 10px;
      border-radius: 3px;
    }

    .stat-clothing {
      background-color: #FFB7B2;
    }

    .stat-stationery {
      background-color: #BFFCC6;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 30px;
    }

    .card {
      background: var(--secondary-background);
      border: 3px solid var(--border);
      box-shadow: var(--shadow);
      border-radius: 5px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .image-container {
      position: relative;
      width: 100%;
      padding-top: 100%; /* 1:1 Aspect Ratio */
      background: #f0f0f0;
      border-bottom: 3px solid var(--border);
      overflow: hidden;
    }

    .image-container img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-cover: cover;
    }

    .card-content {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-grow: 1;
    }

    .card-title {
      font-size: 11px;
      font-family: monospace;
      color: #555;
      word-break: break-all;
      margin: 0;
    }

    .selector {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .option-btn {
      width: 100%;
      padding: 8px;
      font-size: 12px;
      font-weight: 700;
      border: 2px solid var(--border);
      border-radius: 3px;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.2s;
      background-color: #fff;
    }

    .option-btn.selected-clothing {
      background-color: #FFB7B2;
      box-shadow: 2px 2px 0px 0px var(--border);
    }

    .option-btn.selected-stationery {
      background-color: #BFFCC6;
      box-shadow: 2px 2px 0px 0px var(--border);
    }

    .option-btn:hover {
      opacity: 0.9;
    }

    .status-toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #4EAA84;
      color: white;
      border: 3px solid #000;
      box-shadow: 4px 4px 0px 0px #000;
      padding: 15px 30px;
      font-weight: 700;
      border-radius: 5px;
      z-index: 1000;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>تفکیک و مرتب‌سازی تصاویر پروژه Verde</h1>
        <p class="subtitle">تصاویر زیر را دسته‌بندی کنید. پس از پایان، روی دکمه ذخیره کلیک کنید تا گروه کارهای لباس و ست اداری در سایت در کنار هم مرتب شوند.</p>
        <div class="stats">
          <div class="stat-badge stat-clothing">لباس و پوشاک: <span id="clothing-count">0</span></div>
          <div class="stat-badge stat-stationery">ست اداری و پاکت‌نامه: <span id="stationery-count">0</span></div>
          <div class="stat-badge">بدون دسته‌بندی: <span id="unassigned-count">25</span></div>
        </div>
      </div>
      <button class="btn-save" onclick="saveCategories()">✓ ثبت و ذخیره تغییرات در پروژه</button>
    </header>

    <div class="grid" id="image-grid">
      <!-- Cards will be populated dynamically -->
    </div>
  </div>

  <div class="status-toast" id="toast">تغییرات با موفقیت در پروژه ثبت شد!</div>

  <script>
    // List of images
    const images = [
      "Gemini_Generated_Image_1fwo9m1fwo9m1fwo-clean.png",
      "Gemini_Generated_Image_2nmv7v2nmv7v2nmv-clean.png",
      "Gemini_Generated_Image_3wem5u3wem5u3wem-clean.png",
      "Gemini_Generated_Image_418rhs418rhs418r-clean.png",
      "Gemini_Generated_Image_61et6761et6761et-clean.png",
      "Gemini_Generated_Image_6tlc6w6tlc6w6tlc-clean.png",
      "Gemini_Generated_Image_9jmroa9jmroa9jmr-clean.png",
      "Gemini_Generated_Image_9ymg4l9ymg4l9ymg (1)-clean.png",
      "Gemini_Generated_Image_b57haqb57haqb57h-clean.png",
      "Gemini_Generated_Image_coy0f7coy0f7coy0-clean.png",
      "Gemini_Generated_Image_dr9z3udr9z3udr9z-clean.png",
      "Gemini_Generated_Image_ev50dwev50dwev50-clean.png",
      "Gemini_Generated_Image_gkjq1cgkjq1cgkjq-clean.png",
      "Gemini_Generated_Image_h8twq9h8twq9h8tw-clean.png",
      "Gemini_Generated_Image_hnqx33hnqx33hnqx-clean.png",
      "Gemini_Generated_Image_jb5er7jb5er7jb5e-clean.png",
      "Gemini_Generated_Image_kynmuqkynmuqkynm-clean.png",
      "Gemini_Generated_Image_myoakpmyoakpmyoa-clean.png",
      "Gemini_Generated_Image_na7gz7na7gz7na7g-clean.png",
      "Gemini_Generated_Image_q0xkpmq0xkpmq0xk-clean.png",
      "Gemini_Generated_Image_re46ojre46ojre46-clean.png",
      "Gemini_Generated_Image_sdlbydsdlbydsdlb-clean.png",
      "Gemini_Generated_Image_x6gtg1x6gtg1x6gt-clean.png",
      "Gemini_Generated_Image_xqyoogxqyoogxqyo-clean.png",
      "Gemini_Generated_Image_z9s11zz9s11zz9s1-clean.png"
    ];

    // State object to hold categories
    const categories = {};
    images.forEach(img => {
      categories[img] = 'unassigned'; // 'clothing', 'stationery', 'unassigned'
    });

    const folderPath = '/nemoone kaar/ست اداری verde/';

    // Render Grid
    const grid = document.getElementById('image-grid');
    
    images.forEach(img => {
      const card = document.createElement('div');
      card.className = 'card';
      card.id = `card-${img}`;

      card.innerHTML = `
        <div class="image-container">
          <img src="${folderPath}${img}" alt="${img}" />
        </div>
        <div class="card-content">
          <p class="card-title">${img}</p>
          <div class="selector">
            <button class="option-btn" id="btn-clothing-${img}" onclick="selectCategory('${img}', 'clothing')">👕 لباس و پوشاک</button>
            <button class="option-btn" id="btn-stationery-${img}" onclick="selectCategory('${img}', 'stationery')">✉️ ست اداری و پاکت</button>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });

    function selectCategory(img, cat) {
      const current = categories[img];
      
      // Reset buttons
      document.getElementById(`btn-clothing-${img}`).className = 'option-btn';
      document.getElementById(`btn-stationery-${img}`).className = 'option-btn';

      if (current === cat) {
        categories[img] = 'unassigned';
      } else {
        categories[img] = cat;
        if (cat === 'clothing') {
          document.getElementById(`btn-clothing-${img}`).className = 'option-btn selected-clothing';
        } else if (cat === 'stationery') {
          document.getElementById(`btn-stationery-${img}`).className = 'option-btn selected-stationery';
        }
      }

      updateStats();
    }

    function updateStats() {
      let clothing = 0;
      let stationery = 0;
      let unassigned = 0;

      Object.values(categories).forEach(val => {
        if (val === 'clothing') clothing++;
        else if (val === 'stationery') stationery++;
        else unassigned++;
      });

      document.getElementById('clothing-count').innerText = clothing;
      document.getElementById('stationery-count').innerText = stationery;
      document.getElementById('unassigned-count').innerText = unassigned;
    }

    async function saveCategories() {
      // Create asset list: first clothing, then stationery, then unassigned
      const assetList = [];

      // 1. Clothing
      images.forEach(img => {
        if (categories[img] === 'clothing') {
          assetList.push({ type: 'image', url: `${folderPath}${img}`, category: 'clothing' });
        }
      });

      // 2. Stationery
      images.forEach(img => {
        if (categories[img] === 'stationery') {
          assetList.push({ type: 'image', url: `${folderPath}${img}`, category: 'stationery' });
        }
      });

      // 3. Unassigned (just in case)
      images.forEach(img => {
        if (categories[img] === 'unassigned') {
          assetList.push({ type: 'image', url: `${folderPath}${img}`, category: 'unassigned' });
        }
      });

      try {
        const response = await fetch('/api/save-verde', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ assets: assetList })
        });

        const result = await response.json();
        if (result.success) {
          const toast = document.getElementById('toast');
          toast.style.display = 'block';
          setTimeout(() => {
            toast.style.display = 'none';
          }, 3000);
        } else {
          alert('خطا در ذخیره‌سازی: ' + result.error);
        }
      } catch (error) {
        alert('خطای ارتباط با سرور: ' + error.message);
      }
    }
  </script>
</body>
</html>
